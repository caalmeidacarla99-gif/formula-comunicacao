<script>
// ── TABS ──
function switchTab(id, btn) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-' + id).classList.add('active');
  btn.classList.add('active');
}

// ── CHIPS (WHY, WHEN, WHERE, HOW, HOWLONG) ──
function toggleChip(el) {
  el.classList.toggle('selected');
}

// ── ARQUÉTIPOS (máximo 3) ──
function toggleArquetipo(el) {
  const selected = document.querySelectorAll('.arquetipo-card.selected');
  if (el.classList.contains('selected')) {
    el.classList.remove('selected');
  } else {
    if (selected.length >= 3) {
      alert('Escolha no máximo 3 arquétipos.');
      return;
    }
    el.classList.add('selected');
  }
}

// ── PEGAR VALORES DOS CHIPS ──
function getChips(id) {
  return [...document.querySelectorAll(`#${id} .chip.selected`)]
    .map(c => c.dataset.val).join(', ');
}

// ── PEGAR ARQUÉTIPOS ──
function getArquetipos() {
  return [...document.querySelectorAll('.arquetipo-card.selected')]
    .map(c => c.dataset.val).join(', ');
}

// ── BUILD CONTENT ──
async function buildContent() {
  const emissor  = document.getElementById('b-emissor').value.trim();
  const arquetipos = getArquetipos();
  const what     = document.getElementById('b-what').value.trim();
  const who      = document.getElementById('b-who').value.trim();
  const why      = getChips('why-chips') || document.getElementById('b-why-custom').value.trim();
  const when     = getChips('when-chips');
  const where    = getChips('where-chips');
  const how      = getChips('how-chips');
  const howlong  = getChips('howlong-chips');

  if (!emissor || !arquetipos || !what || !who) {
    alert('Preencha os campos obrigatórios: EMISSOR, ARQUÉTIPOS, WHAT e WHO.');
    return;
  }

  const box = document.getElementById('resultBox');
  box.innerHTML = `
    <div class="result-loading">
      <div class="spinner"></div>
      <div class="loading-txt">Gerando sugestões...</div>
    </div>`;

  const userPrompt = `
EMISSOR: ${emissor}
ARQUÉTIPOS DO EMISSOR: ${arquetipos}
WHAT (mensagem): ${what}
WHO (público): ${who}
WHY (função): ${why || 'não informado'}
WHEN (timing): ${when || 'não informado'}
WHERE (canal): ${where || 'não informado'}
HOW (formato): ${how || 'não informado'}
HOW LONG (produção): ${howlong || 'não informado'}
`;

  try {
    const response = await fetch('/.netlify/functions/gemini', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
        contents: [{ parts: [{ text: userPrompt }] }]
      })
    });

    const data = await response.json();
    const raw = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
    const clean = raw.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(clean);
    renderResult(parsed.sugestoes);

  } catch(e) {
    box.innerHTML = `
      <div class="result-empty">
        <div class="result-empty-icon">⚠️</div>
        <div class="result-empty-txt">Erro ao gerar sugestões.<br>${e.message}</div>
      </div>`;
  }
}

// ── RENDERIZAR RESULTADO ──
function renderResult(sugestoes) {
  const box = document.getElementById('resultBox');
  box.innerHTML = '';

  sugestoes.forEach(s => {
    const card = document.createElement('div');
    card.className = `sugestao-card rank-${s.rank}`;
    card.innerHTML = `
      <div class="sug-header">
        <div>
          <div class="sug-rank">✦ OPÇÃO ${s.rank}</div>
          <div class="sug-titulo">${s.titulo}</div>
          <div class="sug-formato">${s.formato_criativo} · ${s.formato_base}</div>
        </div>
      </div>
      <div class="sug-section">
        <div class="sug-section-label">Por que esta opção?</div>
        <div class="sug-section-content">${s.justificativa_rank}</div>
      </div>
      <div class="sug-section">
        <div class="sug-section-label">Arquétipo de cena</div>
        <div class="sug-section-content">${s.arquetipo_de_cena}</div>
      </div>
      <div class="sug-section">
        <div class="sug-section-label">Tom de voz</div>
        <div class="sug-section-content">${s.tom_de_voz}</div>
      </div>
      <div class="sug-section">
        <div class="sug-section-label">Figuras recomendadas</div>
        <div class="sug-tags">
          ${s.figuras_recomendadas.map(f =>
            `<span class="sug-tag">${f} — ${s.por_que_cada_figura[f] || ''}</span>`
          ).join('')}
        </div>
      </div>
      <div class="sug-section">
        <div class="sug-section-label">Gancho sugerido</div>
        <div class="gancho-box">${s.gancho_sugerido}</div>
      </div>
      <div class="sug-section">
        <div class="sug-section-label">Estrutura narrativa</div>
        <div class="roteiro-box">
          <div class="roteiro-phase">
            <div class="roteiro-phase-title">⚡ Gatilho</div>
            <div class="roteiro-phase-content">${s.estrutura_narrativa.gatilho}</div>
          </div>
          <div class="roteiro-phase">
            <div class="roteiro-phase-title">→ Rotina</div>
            <div class="roteiro-phase-content">${s.estrutura_narrativa.rotina}</div>
          </div>
          <div class="roteiro-phase">
            <div class="roteiro-phase-title">✦ Recompensa</div>
            <div class="roteiro-phase-content">${s.estrutura_narrativa.recompensa}</div>
          </div>
        </div>
      </div>
      <div class="sug-section">
        <div class="sug-section-label">Gatilho viral</div>
        <div class="sug-section-content">${s.gatilho_viral}</div>
      </div>
      <div class="sug-section">
        <div class="sug-section-label">Tempo estimado</div>
        <div class="sug-section-content">${s.tempo_estimado}</div>
      </div>
      <button class="copy-btn" onclick="copyCard(this)">↗ Copiar resumo</button>
    `;
    box.appendChild(card);
  });
}

// ── COPIAR CARD ──
function copyCard(btn) {
  const card = btn.closest('.sugestao-card');
  const text = card.innerText.replace('↗ Copiar resumo', '').trim();
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copiado!';
    setTimeout(() => btn.textContent = '↗ Copiar resumo', 2000);
  });
}

// ── DADOS E RENDERIZAÇÃO DAS ABAS ──
const flowNodes = [
  {icon:'👤',name:'Emissor',code:'E'},
  {icon:'💬',name:'Mensagem',code:'M'},
  {icon:'📡',name:'Canal',code:'C'},
  {icon:'🎯',name:'Receptor',code:'R'},
  {icon:'🌍',name:'Contexto',code:'Ctx'},
  {icon:'⚡',name:'Ruído',code:'∅'},
  {icon:'✦',name:'Transformação',code:'Δ'}
];

function renderFlow() {
  const row = document.getElementById('flowRow');
  if (!row) return;
  flowNodes.forEach((n, i) => {
    const node = document.createElement('div');
    node.className = 'fnode';
    node.innerHTML = `
      <div class="fnode-icon">${n.icon}</div>
      <div class="fnode-name">${n.name}</div>
      <div class="fnode-code">${n.code}</div>`;
    row.appendChild(node);
    if (i < flowNodes.length - 1) {
      const arrow = document.createElement('div');
      arrow.className = 'farrow';
      arrow.innerHTML = `<div class="farrow-line"></div><div class="farrow-head">▶</div>`;
      row.appendChild(arrow);
    }
  });
}

// Inicializa
renderFlow();
</script>
